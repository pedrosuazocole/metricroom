<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B"/>
      <stop offset="100%" style="stop-color:#0D2040"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7D060"/>
      <stop offset="100%" style="stop-color:#D4A017"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular azul profundo -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- Anillo decorativo exterior -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#F7D06022" stroke-width="2"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#F7D06018" stroke-width="1"/>

  <!-- ===== EDIFICIO HOTEL ===== -->
  <!-- Base del edificio -->
  <rect x="148" y="198" width="216" height="188" rx="4" fill="#F7D060" opacity="0.95"/>
  
  <!-- Sombra lateral del edificio -->
  <rect x="340" y="202" width="24" height="184" rx="4" fill="#D4A017" opacity="0.5"/>
  
  <!-- Techo en A con ángulo pronunciado -->
  <polygon points="256,118 130,200 382,200" fill="url(#gold)"/>
  <polygon points="256,118 130,200 148,200 256,132 364,200 382,200" fill="#D4A017" opacity="0.4"/>
  
  <!-- Moldura del techo -->
  <rect x="128" y="196" width="256" height="10" rx="2" fill="#D4A017"/>

  <!-- Chimenea / detalle arquitectónico -->
  <rect x="230" y="100" width="18" height="22" rx="2" fill="#D4A017"/>
  <rect x="226" y="96" width="26" height="8" rx="2" fill="#F7D060"/>

  <!-- VENTANAS - Fila 1 -->
  <rect x="170" y="220" width="46" height="42" rx="3" fill="#1B3A6B"/>
  <rect x="233" y="220" width="46" height="42" rx="3" fill="#1B3A6B"/>
  <rect x="296" y="220" width="46" height="42" rx="3" fill="#1B3A6B"/>
  <!-- Luz en ventanas fila 1 -->
  <rect x="172" y="222" width="42" height="4" rx="1" fill="#F7D06040"/>
  <rect x="235" y="222" width="42" height="4" rx="1" fill="#F7D06040"/>
  <rect x="298" y="222" width="42" height="4" rx="1" fill="#F7D06040"/>
  <!-- Cruz ventana -->
  <rect x="191" y="220" width="3" height="42" fill="#0D2040" opacity="0.4"/>
  <rect x="170" y="239" width="46" height="3" fill="#0D2040" opacity="0.4"/>
  <rect x="254" y="220" width="3" height="42" fill="#0D2040" opacity="0.4"/>
  <rect x="233" y="239" width="46" height="3" fill="#0D2040" opacity="0.4"/>
  <rect x="317" y="220" width="3" height="42" fill="#0D2040" opacity="0.4"/>
  <rect x="296" y="239" width="46" height="3" fill="#0D2040" opacity="0.4"/>

  <!-- VENTANAS - Fila 2 -->
  <rect x="170" y="278" width="46" height="42" rx="3" fill="#1B3A6B"/>
  <rect x="296" y="278" width="46" height="42" rx="3" fill="#1B3A6B"/>
  <!-- Cruz ventana fila 2 -->
  <rect x="191" y="278" width="3" height="42" fill="#0D2040" opacity="0.4"/>
  <rect x="170" y="297" width="46" height="3" fill="#0D2040" opacity="0.4"/>
  <rect x="317" y="278" width="3" height="42" fill="#0D2040" opacity="0.4"/>
  <rect x="296" y="297" width="46" height="3" fill="#0D2040" opacity="0.4"/>

  <!-- PUERTA CENTRAL arco -->
  <rect x="226" y="298" width="60" height="88" rx="30" fill="#1B3A6B"/>
  <rect x="226" y="328" width="60" height="58" fill="#1B3A6B"/>
  <!-- Detalle puerta -->
  <rect x="233" y="316" width="24" height="32" rx="2" fill="#0D2040" opacity="0.5"/>
  <rect x="255" y="316" width="24" height="32" rx="2" fill="#0D2040" opacity="0.5"/>
  <!-- Manija -->
  <circle cx="252" cy="336" r="3" fill="#F7D060" opacity="0.8"/>
  <circle cx="260" cy="336" r="3" fill="#F7D060" opacity="0.8"/>

  <!-- Escalones -->
  <rect x="202" y="384" width="108" height="7" rx="1" fill="#C49010"/>
  <rect x="192" y="389" width="128" height="7" rx="1" fill="#B8820E"/>

  <!-- Estrella de 5 puntas en el techo -->
  <g transform="translate(256, 105)">
    <polygon points="0,-16 4,-6 15,-6 7,1 10,12 0,6 -10,12 -7,1 -15,-6 -4,-6" fill="#F7D060"/>
  </g>

  <!-- ===== TEXTO "MetricRoom" ===== -->
  <text x="256" y="432" 
    font-family="Georgia, serif" 
    font-size="38" 
    font-weight="bold"
    fill="#F7D060"
    text-anchor="middle"
    letter-spacing="2">MetricRoom</text>
    
  <!-- Línea decorativa bajo el texto -->
  <line x1="170" y1="440" x2="342" y2="440" stroke="#F7D06060" stroke-width="1"/>
  
  <!-- Subtítulo -->
  <text x="256" y="458"
    font-family="Georgia, serif"
    font-size="13"
    fill="#F7D06099"
    text-anchor="middle"
    letter-spacing="4">HOTEL MANAGEMENT</text>
</svg>